name: Release

# Publish when a GitHub Release is published (tag must match package.json, e.g. v1.5.1),
# or run manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the .vsix to the GitHub Release
      id-token: write # OIDC trusted publishing to the VS Code Marketplace
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }} # optional; Open VSX step is skipped if unset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package
        run: npx vsce package --out theme.vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --oidc --packagePath theme.vsix --skip-duplicate

      - name: Publish to Open VSX (Cursor, Cloud Shell, VSCodium)
        if: env.OVSX_PAT != ''
        run: npx ovsx publish theme.vsix --pat "$OVSX_PAT" --skip-duplicate

      - name: Attach .vsix to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" theme.vsix --clobber
